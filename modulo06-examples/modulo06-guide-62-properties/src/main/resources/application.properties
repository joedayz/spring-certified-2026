# ========================================
# application.properties (propiedades por defecto)
# ========================================

# --- @Value demo ---
app.message=Hola desde application.properties (default profile)
app.max-retries=3

# --- @ConfigurationProperties: app.info ---
app.info.name=modulo06-guide-62
app.info.description=Demo de externalized configuration
app.info.version=1.0.0
app.info.environment=default

# --- @ConfigurationProperties: app.datasource (tipos complejos) ---
app.datasource.url=jdbc:h2:mem:defaultdb
app.datasource.username=sa
app.datasource.driver-class-name=org.h2.Driver
app.datasource.pool.max-size=10
app.datasource.pool.min-idle=2
app.datasource.pool.timeout-ms=30000
app.datasource.init-scripts[0]=schema.sql
app.datasource.init-scripts[1]=data.sql
app.datasource.additional-properties.cachePrepStmts=true
app.datasource.additional-properties.prepStmtCacheSize=250
