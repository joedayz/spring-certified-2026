# ========================================
# Actuator - application.properties
# ========================================

# --- Exponer TODOS los endpoints de Actuator (solo para demo/desarrollo) ---
management.endpoints.web.exposure.include=*

# --- Mostrar detalles del health (por defecto solo muestra UP/DOWN) ---
management.endpoint.health.show-details=always

# --- Info estática desde application.properties ---
info.app.name=Guia 6.3 - Spring Boot Actuator
info.app.version=1.0.0
info.app.description=Demo de endpoints de Actuator, Health, Info, Metrics y endpoints personalizados
info.app.java-version=${java.version}
